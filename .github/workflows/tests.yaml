name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch:
    inputs:
      pyjoyment-ref:
        description: The branch, tag or commit of Pyjoyment to test against, or the release of uv.lock
        required: false

permissions:
  contents: read

jobs:
  # The Pyjoyment to test against: the release of uv.lock, with which the
  # reactor is installed, and its tag, whose suite the job prove runs on
  # the reactor, or its commit when uv.lock has it from Git until a
  # release; or the ref of a dispatch, a branch, a tag or a commit, whose
  # Pyjoyment of Git is installed over the release with `--with`, not
  # editable, as an installation from Git gets it, and whose checkout gives
  # the suite.
  pyjoyment:
    name: pyjoyment

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5

    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      with: ${{ steps.resolve.outputs.with }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve the ref of Pyjoyment
        id: resolve
        shell: bash
        env:
          REF: ${{ inputs.pyjoyment-ref }}
        run: |-
          if [ -n "$REF" ]; then
            echo "ref=$REF" >> "$GITHUB_OUTPUT"
            echo "with=pyjoyment @ git+https://github.com/pyjoyment/Pyjoyment@$REF" >> "$GITHUB_OUTPUT"
          else
            python3 -c 'import tomllib; p = next(p for p in tomllib.load(open("uv.lock", "rb"))["package"] if p["name"] == "pyjoyment"); print("ref=" + (p["source"]["git"].rpartition("#")[2] if "git" in p["source"] else p["version"]))' >> "$GITHUB_OUTPUT"
          fi

  # The whole suite of Pyjoyment on this reactor, as a reactor has to pass all
  # of it, and the test of the reactor itself, on Windows,
  # the one system that Winloop has wheels for.
  prove:
    name: prove (python ${{ matrix.python }})
    needs: pyjoyment

    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
          - 3.15t

    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: Pyjo-Reactor-Winloop

      - name: Checkout Pyjoyment
        uses: actions/checkout@v7
        with:
          repository: pyjoyment/Pyjoyment
          ref: ${{ needs.pyjoyment.outputs.ref }}
          path: Pyjoyment

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.13.7 # datasource=github-releases depName=astral-sh/uv

      # The interpreter of setup-python by its path of Windows, as the one of Git
      # Bash, from command -v, is a path of MSYS without .exe
      - name: Install
        working-directory: Pyjo-Reactor-Winloop
        shell: bash
        run: uv sync --python "$(python -c 'import sys; print(sys.executable)')"

      # As in Pyjoyment: invalid escape sequences and deprecated APIs fail, and
      # the ResourceWarning of the development mode of Python, which only goes
      # to the standard error, is checked in the output.
      - name: Run the tests of the reactor
        working-directory: Pyjo-Reactor-Winloop
        shell: bash
        env:
          PYTHONDEVMODE: "1"
          PYTHONWARNINGS: error::SyntaxWarning,error::DeprecationWarning
          PYJOYMENT: ${{ needs.pyjoyment.outputs.with }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/junit"
          uv run ${PYJOYMENT:+--with "$PYJOYMENT"} python -m Pyjo.Prove -l --color --timeout 60 --capture-stderr --formatter "junit=$GITHUB_WORKSPACE/junit/pyjo-reactor-winloop.xml" --formatter "markdown=$GITHUB_STEP_SUMMARY" -r t 2>&1 | tee prove.log
          if grep -n 'ResourceWarning:' prove.log; then exit 1; fi

      # As in Pyjoyment: the debug mode of asyncio of PYTHONDEVMODE logs a
      # callback of more than 0.1 seconds, which TLS and the applications of the
      # tests take on a busy runner, so the loops log only one of more than 5
      # seconds, with PYJO_ASYNCIO_SLOW_CALLBACK.
      - name: Run the tests of Pyjoyment on the reactor
        working-directory: Pyjoyment
        shell: bash
        env:
          PYJO_REACTOR: Pyjo.Reactor.Winloop
          PYTHONDEVMODE: "1"
          PYJO_ASYNCIO_SLOW_CALLBACK: "5"
          PYTHONWARNINGS: error::SyntaxWarning,error::DeprecationWarning
          TEST_ONLINE: "1"
        run: |-
          uv run --project ../Pyjo-Reactor-Winloop --with-editable . python -m Pyjo.Prove -l --color -j 4 --timeout 120 --capture-stderr --stderr-lines 1000 --formatter "junit=$GITHUB_WORKSPACE/junit/pyjoyment.xml" --formatter "markdown=$GITHUB_STEP_SUMMARY" -r t 2>&1 | tee prove.log
          if grep -n 'ResourceWarning:' prove.log; then exit 1; fi

      # As in Pyjoyment: the JUnit XML of the harness, of the tests of the
      # reactor and of Pyjoyment, as the annotations of the failed tests,
      # without a check of its own, and without the summary of the job, which
      # the harness writes itself with its formatter markdown
      - name: Publish the report of the tests
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: junit/*.xml
          annotate_only: true
          job_summary: false
          include_skipped: false

      # The JUnit XML for the summary of the summaries of all the jobs, which
      # the job report makes, both files in one directory, as its script reads
      # the files of the directory of each job only
      - name: Upload the report of the tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-prove (python ${{ matrix.python }})
          path: junit/*.xml
          if-no-files-found: ignore
          retention-days: 7

  # The summary of the summaries of the jobs of the tests, from the JUnit XML
  # that they upload, as the summary of this job and as a comment of the pull
  # request, which each run edits, as in Pyjoyment, with the script of its
  # checkout of main, which needs Pyjo.DOM. A pull request of a fork has a
  # token that cannot comment.
  report:
    name: report
    needs:
      - prove
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Pyjoyment
        uses: actions/checkout@v7
        with:
          repository: pyjoyment/Pyjoyment
          ref: main
          path: Pyjoyment

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.15.2
          allow-prereleases: true

      - name: Download the reports of the tests
        uses: actions/download-artifact@v8
        with:
          pattern: junit-*
          path: reports

      # The names and the URLs of the jobs of the run, of its latest attempt,
      # which link the jobs of the summary
      - name: Summary of the reports
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: Pyjoyment
        run: |-
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '.jobs[] | [.name, .html_url] | @tsv' > jobs.tsv
          python Pyjoyment/.github/scripts/test-report.py reports jobs.tsv > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      # The comment that starts with the marker of the report, edited, or a new one
      - name: Comment on the pull request
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name ==
          github.repository }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |-
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq '.[] | select(.body | startswith("<!-- pyjo-prove-report -->")) | .id' | head -n 1)"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@report.md > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@report.md > /dev/null
          fi

  # The one check that the ruleset of main requires, whatever the matrix has,
  # as in Pyjoyment: it fails when a job failed or was cancelled, so a new
  # version of Python needs no change of the ruleset.
  tests:
    name: Tests
    needs:
      - pyjoyment
      - prove
    if: always()
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5

    steps:
      - name: Check the results of the jobs
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |-
          echo "$RESULTS"
          for result in $RESULTS; do
            test "$result" = success
          done
