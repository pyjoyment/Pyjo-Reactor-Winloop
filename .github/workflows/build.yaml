name: Build

# Checks that uv.lock matches pyproject.toml, builds the sdist and the wheel,
# checks that the wheel has the module of the reactor and nothing of the
# namespace of Pyjoyment, and installs it with Pyjoyment and imports it and
# runs examples/loopback_winloop.py, a request to a server of its own on the
# loop of Winloop, outside the checkout.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: build

    # Windows, where the wheel installs Winloop, which the example runs on
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.8 # datasource=github-releases depName=jdx/mise

      # uv.lock has to match pyproject.toml.
      - name: Check uv.lock
        run: uv lock --check

      - name: Build sdist and wheel
        run: uv build

      # The packages Pyjo and Pyjo.Reactor are those of Pyjoyment: a wheel
      # with their __init__.py would overwrite the files of Pyjoyment.
      - name: Check wheel contents
        run: |-
          python -m zipfile -l dist/*.whl | tee wheel.txt
          grep -q 'Pyjo/Reactor/Winloop.py' wheel.txt
          if grep -E 'Pyjo/(Reactor/)?__init__\.py' wheel.txt; then exit 1; fi

      # The wheel in an environment of its own, outside the checkout, so that
      # nothing comes from it, with the Pyjoyment of PyPI that it depends on.
      # The first line of the example is the class of the reactor and whether
      # its loop is one of Winloop, so that Pyjo.Reactor.Asyncio or a loop of asyncio
      # in their place fails the step. Python of Windows ends its lines with
      # CRLF, which diff leaves out.
      - name: Install and run the wheel
        shell: bash
        run: |-
          uv venv --python "$(python -c 'import sys; print(sys.executable)')" "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" dist/*.whl
          cp examples/loopback_winloop.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          venv/Scripts/python -c 'import Pyjo.Reactor.Winloop; print(Pyjo.Reactor.Winloop.__version__)'
          venv/Scripts/python loopback_winloop.py | tee loopback.txt
          diff --strip-trailing-cr - loopback.txt <<'EOF'
          Pyjo_Reactor_Winloop winloop
          200 Your Pyjo is working!
          EOF
