[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "Pyjo-Reactor-Winloop"
version = "0.1.0.dev1"
description = "Low level event reactor with Winloop support for Pyjoyment."
readme = "README.md"
license = "Artistic-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Piotr Roszatycki", email = "piotr.roszatycki@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["Pyjoyment>=0.3.0", "winloop>=0.8.2; sys_platform == 'win32'"]
keywords = ["pyjoyment", "reactor", "winloop", "asyncio", "windows"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/pyjoyment/Pyjo-Reactor-Winloop"
Documentation = "https://pyjoyment.readthedocs.io/projects/pyjo-reactor-winloop/en/stable/"

# Sphinx of docs/, which Read the Docs and the workflow Docs install with uv sync --group docs
[dependency-groups]
docs = ["sphinx>=9.2.0"]

# The documentation is built with Python 3.14 of Read the Docs and 3.15 of the workflow Docs, not with the lowest Python
# of the distribution, which a new Sphinx may not support, as Sphinx 9.2 does not support 3.12
[tool.uv.dependency-groups]
docs = { requires-python = ">=3.14" }

# Only the module: the packages Pyjo and Pyjo.Reactor are those of Pyjoyment, whose namespace extend_path keeps open
[tool.hatch.build.targets.wheel]
only-include = ["Pyjo/Reactor/Winloop.py"]

# The files of the distribution, as in Pyjoyment, and not the files of the tools, as .trunk
[tool.hatch.build.targets.sdist]
include = [
  "/Pyjo",
  "/t",
  "/examples",
  "/docs",
  "/.proverc",
  "/LICENSE",
  "/README.md",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

# The rules of Pyjoyment, whose conventions this distribution follows.
[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test scripts import all test functions, like `use Test::More` in Perl.
"t/**" = [
  # F403 "`from Pyjo.Test import *` used; unable to detect undefined names"
  "F403",
  # F405 "`ok` may be undefined, or defined from star imports"
  "F405",
]

[tool.ruff.lint.isort]
# Pyjo modules first, then the standard library, then the others, as in Pyjoyment.
known-first-party = ["Pyjo", "Pyjoyment"]
section-order = [
  "future",
  "first-party",
  "local-folder",
  "standard-library",
  "third-party",
]
lines-between-types = 1
lines-after-imports = 2

# The environment of uv sync, where Pyjoyment and Winloop are, for pyright of Trunk too
[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "off"
strict = ["Pyjo/Reactor/Winloop.py"]
